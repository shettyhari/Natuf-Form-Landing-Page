# Nginx site config for the Natuf landing page.
# Copy to /etc/nginx/sites-available/natuf, symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Replace apply.natuf.com with your domain. Add HTTPS with: sudo certbot --nginx -d apply.natuf.com

server {
    listen 80;
    server_name apply.natuf.com;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
